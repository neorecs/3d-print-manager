name: print-manager-recovery-test

services:
  recovery_source_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recovery_source
      POSTGRES_USER: recovery_test
      POSTGRES_PASSWORD: recovery-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery_test -d recovery_source"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  recovery_restore_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recovery_restore
      POSTGRES_USER: recovery_test
      POSTGRES_PASSWORD: recovery-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery_test -d recovery_restore"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  recovery_seed:
    build: ./app/backend
    environment:
      DATABASE_URL: postgresql+psycopg://recovery_test:recovery-test-only@recovery_source_db:5432/recovery_source
      CREDENTIAL_ENCRYPTION_KEY: 4pmcM6TeV2L8D4WWuQV3XGjxM2aJ3qS4Ph3CEmE-hzA=
      AUTH_SECRET: test-auth-secret-at-least-32-characters-long
      BACKEND_INTERNAL_TOKEN: test-internal-token-at-least-32-characters
      CONNECTORS_LIVE_MODE: "false"
    command: ["sh", "-c", "alembic upgrade head && PYTHONPATH=/app python tests/recovery_seed.py"]
    depends_on:
      recovery_source_db:
        condition: service_healthy
    volumes:
      - recovery_uploads:/app/uploads

  recovery_postgres_backup:
    build: ./ops/postgres-backup
    environment:
      DATABASE_URL: postgresql+psycopg://recovery_test:recovery-test-only@recovery_source_db:5432/recovery_source
      BACKUP_RUN_ONCE: "true"
      BACKUP_DIR: /backups/daily
      BACKUP_STATUS_DIR: /backups/status
    depends_on:
      recovery_source_db:
        condition: service_healthy
    volumes:
      - recovery_backups:/backups

  recovery_uploads_backup:
    build: ./ops/uploads-backup
    environment:
      BACKUP_RUN_ONCE: "true"
      UPLOAD_SOURCE_DIR: /uploads
      UPLOAD_BACKUP_DIR: /backups/uploads
      BACKUP_STATUS_DIR: /backups/status
    volumes:
      - recovery_uploads:/uploads:ro
      - recovery_backups:/backups

  recovery_verify:
    build: ./ops/recovery-test
    environment:
      RESTORE_DATABASE_URL: postgresql://recovery_test:recovery-test-only@recovery_restore_db:5432/recovery_restore
    depends_on:
      recovery_restore_db:
        condition: service_healthy
    volumes:
      - recovery_backups:/backups:ro

volumes:
  recovery_backups:
  recovery_uploads:
