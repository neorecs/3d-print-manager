services:
  backend:
    build: ./app/backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-https://10.5.1.150:38503}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      SHOPIFY_API_VERSION: ${SHOPIFY_API_VERSION:-2026-04}
      CONNECTORS_LIVE_MODE: ${CONNECTORS_LIVE_MODE:-false}
      AI_OPENAI_ENABLED: ${AI_OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_PRODUCT_MODEL: ${OPENAI_PRODUCT_MODEL:-gpt-5.4-mini}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      AI_PRODUCT_MAX_OUTPUT_TOKENS: ${AI_PRODUCT_MAX_OUTPUT_TOKENS:-2500}
      AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-20}
      UPLOAD_IMAGE_MAX_BYTES: ${UPLOAD_IMAGE_MAX_BYTES:-15728640}
      UPLOAD_ACCOUNTING_MAX_BYTES: ${UPLOAD_ACCOUNTING_MAX_BYTES:-26214400}
      UPLOAD_PRINT_FILE_MAX_BYTES: ${UPLOAD_PRINT_FILE_MAX_BYTES:-524288000}
      AUTH_BOOTSTRAP_SECRET: ${AUTH_BOOTSTRAP_SECRET:-}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      BACKEND_INTERNAL_TOKEN: ${BACKEND_INTERNAL_TOKEN:?BACKEND_INTERNAL_TOKEN is required}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_BACKEND_LOGIN: ${AUTH_BACKEND_LOGIN:-true}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      UPLOAD_BACKUP_ENABLED: ${UPLOAD_BACKUP_ENABLED:-true}
      BACKUP_STATUS_DIR: /backup-status/status
      BACKUP_MAX_AGE_HOURS: 48
    networks:
      - print_manager
    volumes:
      - app_uploads:/app/uploads
      - ${BACKUP_TARGET_PATH:-postgres_backups}:/backup-status:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend_next:
    build: ./app/frontend_next
    environment:
      API_BASE_URL: ${FRONTEND_NEXT_API_BASE_URL:-http://backend:8000}
      BACKEND_INTERNAL_TOKEN: ${BACKEND_INTERNAL_TOKEN:?BACKEND_INTERNAL_TOKEN is required}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_SECRET: ${AUTH_SECRET:-${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-}
      AUTH_ADMIN_NAME: ${AUTH_ADMIN_NAME:-Beheerder}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-}
      AUTH_BACKEND_LOGIN: ${AUTH_BACKEND_LOGIN:-true}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    networks:
      - print_manager
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://$(hostname -i):3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  postgres_backup:
    build: ./ops/postgres-backup
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BACKUP_DIR: /backups/daily
      BACKUP_STATUS_DIR: /backups/status
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RUN_ONCE: ${BACKUP_RUN_ONCE:-false}
    volumes:
      - ${BACKUP_TARGET_PATH:-postgres_backups}:/backups
    networks:
      - print_manager
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "38502:80"
      - "38503:443"
    networks:
      - print_manager
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./ops/caddy/Installeer-HTTPS-certificaat.cmd:/srv/https/Installeer-HTTPS-certificaat.cmd:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend_next:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q --spider https://127.0.0.1/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  uploads_backup:
    build: ./ops/uploads-backup
    environment:
      UPLOAD_SOURCE_DIR: /uploads
      UPLOAD_BACKUP_DIR: /backups/uploads
      BACKUP_STATUS_DIR: /backups/status
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RUN_ONCE: ${BACKUP_RUN_ONCE:-false}
    volumes:
      - app_uploads:/uploads:ro
      - ${BACKUP_TARGET_PATH:-postgres_backups}:/backups
    restart: unless-stopped

networks:
  print_manager:
    external: true
    name: 3d-print-manager_default

volumes:
  app_uploads:
  postgres_backups:
  caddy_data:
  caddy_config:
